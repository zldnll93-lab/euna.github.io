        function generateProblems() {
            const problems = [];
            const fractions = [
                {n: 1, d: 2}, {n: -1, d: 2}, {n: 1, d: 3}, {n: -1, d: 3},
                {n: 2, d: 3}, {n: -2, d: 3}, {n: 1, d: 4}, {n: -1, d: 4},
                {n: 3, d: 4}, {n: -3, d: 4}, {n: 1, d: 5}, {n: -1, d: 5},
                {n: 2, d: 5}, {n: -2, d: 5}, {n: 3, d: 2} 
            ];

            let types = [1, 2, 3, 4, 5]; 
            for (let i = 0; i < 10; i++) {
                types.push(Math.floor(Math.random() * 4) + 2); 
            }
            for (let i = types.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [types[i], types[j]] = [types[j], types[i]];
            }

            for (let i = 0; i < 15; i++) {
                let isFraction = Math.random() < 0.35;
                let baseNum, baseDen, baseAbs;

                if (isFraction) {
                    let f = fractions[Math.floor(Math.random() * fractions.length)];
                    baseNum = Math.abs(f.n); 
                    baseDen = f.d;
                    baseAbs = baseNum / baseDen;
                } else {
                    baseNum = Math.floor(Math.random() * 6) + 1; 
                    baseDen = 1;
                    baseAbs = baseNum;
                }

                let n;
                if (!isFraction && (baseAbs === 5 || baseAbs === 6)) {
                    n = Math.floor(Math.random() * 3) + 2; 
                } else if (!isFraction && baseAbs === 1) {
                    n = Math.floor(Math.random() * 2025) + 2;
                } else if (isFraction) {
                    n = Math.floor(Math.random() * 3) + 2;
                } else {
                    if (baseAbs === 2) {
                        n = Math.floor(Math.random() * 9) + 2;
                    } else {
                        n = Math.floor(Math.random() * 4) + 2;
                    }
                }
                
                let type = types[i]; 

                let answer = calculateAnswer(baseNum, baseDen, n, type);
                let tex = getProblemTex(baseNum, baseDen, n, type);
                
                problems.push({ tex, answer, type, baseNum, baseDen, n });
            }
            return problems;
        }

        function calculateAnswer(baseNum, baseDen, n, type) {
            let resNum = BigInt(baseNum) ** BigInt(n);
            let resDen = BigInt(baseDen) ** BigInt(n);
            let sign = 1n;
            
            if (type === 1) sign = 1n;
            else if (type === 2) sign = (n % 2 === 0) ? 1n : -1n;
            else if (type === 3) sign = -1n;
            else if (type === 4) sign = (n % 2 === 0) ? -1n : 1n;
            else if (type === 5) sign = 1n;

            resNum = resNum * sign;
            return resDen === 1n ? resNum.toString() : `${resNum.toString()}/${resDen.toString()}`;
        }

        function getProblemTex(baseNum, baseDen, n, type) {
            let isFrac = (baseDen !== 1);
            let fracTex = isFrac ? `\\frac{${baseNum}}{${baseDen}}` : `${baseNum}`;
            let wrappedA = isFrac ? `\\left(${fracTex}\\right)` : fracTex;
            
            switch(type) {
                case 1: return `${wrappedA}^{${n}}`;
                case 2: return `\\left(-${fracTex}\\right)^{${n}}`;
                case 3: return `-${wrappedA}^{${n}}`;
                case 4: return `-\\left(-${fracTex}\\right)^{${n}}`;
                case 5: return `-\\left(-${wrappedA}^{${n}}\\right)`;
            }
        }

        function startQuiz() {

        function renderProblem() {
            const p = state.problems[state.currentIdx];

            el.mathProblem.innerHTML = `\\[ ${p.tex} \\]`;

        }

        function playSound(isCorrect) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (isCorrect) {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }
        }

        function handleAnswerSubmit(e) {

            const userAns = el.inputAnswer.value.replace(/\s/g, '');

            state.results.push({

                tex: p.tex,
                user: userAns,
                answer: p.answer,
                correct: isCorrect

            el.feedbackIcon.innerHTML = isCorrect ? '✅' : '❌';

                    quality: 0.95, 
                    pixelRatio: 2, 
                    backgroundColor: '#ffffff',
                    width: fullWidth,   
                    height: fullHeight  
                });
                
                element.classList.add('shadow-sm', 'rounded-xl');
                element.style.padding = '';
                
                if (el.tableWrapper) el.tableWrapper.style.overflow = '';

                // 서버 전송용 PDF 생성
                const { jsPDF } = window.jspdf;
                const img = new Image();
                img.src = dataUrl;
                await new Promise(resolve => { img.onload = resolve; });

                const imgWidth = 210;
                const imgHeight = (img.height * imgWidth) / img.width;
                const pdf = new jsPDF('p', 'mm', [imgWidth, imgHeight]); 
                pdf.addImage(dataUrl, 'JPEG', 0, 0, imgWidth, imgHeight);
                const base64Data = pdf.output('datauristring').split(',')[1];

                const saveRes = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'saveResult',
                        studentId: state.studentId,
                        studentName: state.studentName,
                        correctCount: correctCount,
                        timeTaken: timeTaken,
                        loginTime: state.loginTime,
                        pdfBase64: base64Data
                    })
                });
                await saveRes.json();
                
                const rankRes = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getRanking' })
                });
                const rankData = await rankRes.json();
                renderRanking(rankData.ranking);

            } catch (err) {
                console.error("저장 오류:", err);
                alert("일부 처리 중 오류가 발생했습니다: " + err.message);
            } finally {
                if (el.tableWrapper) el.tableWrapper.style.overflow = '';
                if (document.getElementById('result-overlay')) {
                    document.body.removeChild(document.getElementById('result-overlay'));
                }
            }
        }

        function renderResultUI(correctCount, timeTaken) {
            const m = String(Math.floor(timeTaken / 60)).padStart(2, '0');
            const s = String(timeTaken % 60).padStart(2, '0');
            
            document.getElementById('result-user-info').innerText = 
                `${state.studentId} ${state.studentName} | 로그인: ${state.loginTime}`;
            document.getElementById('result-correct').innerText = correctCount;
            document.getElementById('result-time').innerText = `${m}분 ${s}초`;

            const tbody = document.getElementById('result-table-body');
            tbody.innerHTML = '';
            state.results.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="border p-2">${r.num}</td>
                    <td class="border p-2 text-lg">\\( ${r.tex} \\)</td>
                    <td class="border p-2 font-mono ${r.correct ? 'text-green-600' : 'text-red-600'}">${r.user}</td>
                    <td class="border p-2 font-mono text-blue-600">${r.answer}</td>
                    <td class="border p-2 font-bold">${r.correct ? '✅' : '❌'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderRanking(ranking) {
            const tbody = document.getElementById('ranking-body');
            tbody.innerHTML = '';
            ranking.forEach(r => {
                const m = String(Math.floor(r.timeTaken / 60)).padStart(2, '0');
                const s = String(r.timeTaken % 60).padStart(2, '0');
                
                const tr = document.createElement('tr');
                if(r.studentId == state.studentId) tr.classList.add('bg-yellow-50', 'font-bold');
                
                tr.innerHTML = `
                    <td class="border-b py-2">${r.rank}등</td>
                    <td class="border-b py-2">${r.studentName}</td>
                    <td class="border-b py-2 text-green-600">${r.correctCount}</td>
                    <td class="border-b py-2 text-gray-500">${m}:${s}</td>
                    <td class="border-b py-2 text-gray-400 text-xs">${r.loginTime || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function getAIFeedback(results) {
            const genAI = new GoogleGenerativeAI(API_KEY);
            let modelName = state.workingModelName;

            if (!modelName) {
                for (const cand of MODEL_CANDIDATES) {
                    try {
                        const testModel = genAI.getGenerativeModel({ model: cand });
                        const testRes = await testModel.generateContent("Hi");
                        if (testRes.response.text()) {
                            modelName = cand;
                            state.workingModelName = cand;
                            break;
                        }
                    } catch (e) {
                        console.warn(`${cand} failed:`, e);
                    }
                }
            }
            if (!modelName) throw new Error("사용 가능한 AI 모델을 찾을 수 없습니다.");

            const model = genAI.getGenerativeModel({ model: modelName });
            
            const wrongAnswers = results.filter(r => !r.correct).map(r => 
                `문제: ${r.tex}, 정답: ${r.answer}, 학생의 답: ${r.user}`
            ).join('\n');

            const prompt = `당신은 친절하고 따뜻한 중학교 수학 선생님입니다. 
학생 이름은 '${state.studentName}' 입니다.
학생이 '정수와 유리수의 거듭제곱' 15문제 중 ${results.filter(r=>r.correct).length}문제를 맞혔습니다.

[학생이 틀린 문제 목록]
${wrongAnswers ? wrongAnswers : '틀린 문제가 없습니다! 완벽합니다.'}

다음 2가지 내용을 반드시 "하나의 이어지는 이야기 형식(서술형 줄글)"으로 작성해주세요.

[매우 중요한 작성 규칙]
1. 절대 개조식, 번호 매기기(①, 1., 2.), 글머리 기호(-, *)를 사용하지 마세요! 오직 자연스러운 줄글(문장)로만 작성해야 합니다.
2. 문장 중간이나 수식 앞뒤에서 절대로 엔터(줄바꿈)를 치지 마세요. 각 항목은 하나의 큰 단락으로만 구성해야 합니다.
3. 수식은 무조건 문장 안에 포함되는 인라인 수식인 $수식$ 형태만 사용하세요. ($$수식$$이나 \\[수식\\] 절대 사용 금지)
4. 곱하기 기호는 * 대신 반드시 $\\times$ 기호를 사용하세요.

[내용 1: 총평]
학생의 이름(${state.studentName})을 다정하게 부르며 칭찬하고 격려하는 따뜻한 말

[내용 2: 틀린 문제 설명]
틀린 문제들에 대해 부호 결정, 분수의 거듭제곱 등 핵심 원리를 설명. (틀린 게 없다면 더 큰 칭찬)`;

            const result = await model.generateContent(prompt);
            let cleanText = result.response.text();
            
            cleanText = cleanText.replace(/\$\$/g, '$');
            cleanText = cleanText.replace(/\\\[/g, '$').replace(/\\\]/g, '$');
            
            cleanText = cleanText.replace(/^[\-\*\+]\s+/gm, ''); 
            cleanText = cleanText.replace(/^\d+\.\s+/gm, '');
            cleanText = cleanText.replace(/^[①②③④⑤]\s*/gm, '');

            cleanText = cleanText.replace(/\[내용 1: 총평\]/g, '### 🌟 선생님의 총평\n\n');
            cleanText = cleanText.replace(/\[내용 2: 틀린 문제 설명\]/g, '\n\n### 💡 틀린 문제 설명\n\n');

            cleanText = cleanText.replace(/\n{2,}/g, '@@DOUBLE_ENTER@@'); 
            cleanText = cleanText.replace(/\n/g, ' '); 
            cleanText = cleanText.replace(/@@DOUBLE_ENTER@@/g, '\n\n'); 
            
            // 💡 [해결 핵심 코드] 수식 기호($) 안쪽에 생긴 띄어쓰기를 완벽하게 제거
            // 이 3줄 덕분에 깃허브에서도 에러 없이 MathJax가 수식을 완벽하게 렌더링하게 됩니다!
            cleanText = cleanText.replace(/\$([^\$]+)\$/g, (match, p1) => {
                return '$' + p1.trim() + '$';
            });
            
            return cleanText;
        }

        async function downloadImage() {
            const btn = document.getElementById('btn-download-img');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '다운로드 중...';
            btn.disabled = true;
            
            window.scrollTo(0, 0); 
            const element = document.getElementById('pdf-content');
            
            try {
                element.classList.remove('shadow-sm', 'rounded-xl');
                element.style.padding = '40px';
                element.style.backgroundColor = '#ffffff';

                if (el.tableWrapper) el.tableWrapper.style.overflow = 'visible';

                const fullHeight = element.scrollHeight;
                const fullWidth = element.scrollWidth;

                await new Promise(r => setTimeout(r, 300));

                const dataUrl = await window.htmlToImage.toPng(element, { 
                    quality: 1.0, 
                    pixelRatio: 2, 
                    backgroundColor: '#ffffff',
                    width: fullWidth,   
                    height: fullHeight  
                });
                
                element.classList.add('shadow-sm', 'rounded-xl');
                element.style.padding = '';
                
                if (el.tableWrapper) el.tableWrapper.style.overflow = '';
                
                const link = document.createElement('a');
                link.download = `${state.studentId}_${state.studentName}_결과.png`;
                link.href = dataUrl;
                link.click();
                
            } catch(e) {
                console.error(e);
                alert('이미지 다운로드에 실패했습니다.');
            } finally {
                if (el.tableWrapper) el.tableWrapper.style.overflow = '';
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        window.onload = init;

    </script>
