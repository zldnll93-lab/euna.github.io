<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유리수의 거듭제곱 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.0/marked.min.js"></script>
    <!-- PDF 다운로드를 위한 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            background-color: #f0fdfa; /* 민트 파스텔 배경 */
            font-family: 'Pretendard', sans-serif;
            overflow-x: hidden;
        }
        
        /* 정오답 애니메이션 (도장 효과) */
        .stamp-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .stamp-show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) rotate(-10deg);
        }

        /* 퀴즈 박스 흔들림 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        /* 결과창 표 스타일 (PDF 변환 시 깨짐 방지 및 세로 높이 최적화) */
        .print-table {
            width: 100%;
            border-collapse: collapse;
        }
        .print-table th, .print-table td {
            border: 1px solid #cbd5e1;
            /* 표의 위아래 여백을 11px로 줄여 1쪽 분량에 완벽히 맞춤 */
            padding: 11px 8px; 
            text-align: center;
        }
        .print-table th {
            background-color: #f8fafc;
            font-weight: 700;
            color: #475569;
        }
        .print-table td {
            color: #334155;
        }

        /* [핵심 복구 및 최적화] PDF 페이지 넘김 시 문장 중간이 잘리는 것 방지 */
        /* 제목이나 너무 큰 덩어리는 제외하고, 딱 문단(줄) 단위로만 보호하여 텅 빈 공간 유발 최소화 */
        #ai-feedback-display p, 
        #ai-feedback-display li {
            page-break-inside: avoid;
            break-inside: avoid;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- 최상위 컨테이너: 기본은 좁게(max-w-md), 결과창에서는 넓게(max-w-4xl) 동적 변경됨 -->
    <div id="main-container" class="w-full max-w-md mx-auto space-y-6 pb-4 transition-all duration-500 ease-in-out">
        
        <div class="text-center mt-6 mb-8">
            <h1 class="text-3xl font-bold text-teal-600 mb-2"><i class="fa-solid fa-calculator mr-2"></i>거듭제곱 마스터</h1>
            <p class="text-slate-500 text-sm">중학교 1학년 유리수의 계산 정복하기</p>
        </div>

        <!-- 로그인 섹션 -->
        <div id="sec-login" class="bg-white p-6 rounded-2xl shadow-sm border border-teal-50 flex flex-col space-y-4">
            <h2 class="text-xl font-bold text-slate-700 text-center mb-2">시작하기 전에</h2>
            <input type="text" id="studentId" placeholder="학번 (예: 10101)" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-400 focus:bg-white transition-all">
            <input type="text" id="studentName" placeholder="이름" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-400 focus:bg-white transition-all">
            <input type="password" id="studentPw" placeholder="비밀번호" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-400 focus:bg-white transition-all">
            
            <button onclick="handleLogin()" id="loginBtn" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-4 rounded-xl mt-2 transition-colors">
                로그인 및 시작
            </button>
            <p id="login-error" class="text-red-500 text-sm text-center hidden">정보가 일치하지 않습니다.</p>
        </div>

        <!-- 퀴즈 섹션 -->
        <div id="sec-quiz" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-teal-50 flex-col relative">
            <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                <div class="text-teal-700 font-bold bg-teal-50 px-3 py-1 rounded-full">문제 <span id="q-idx">1</span> / 15</div>
                <div id="quiz-timer" class="text-slate-400 font-mono"><i class="fa-regular fa-clock mr-1"></i>00:00</div>
            </div>

            <div id="stamp-correct" class="stamp-overlay text-emerald-500 text-8xl"><i class="fa-regular fa-circle"></i></div>
            <div id="stamp-wrong" class="stamp-overlay text-rose-500 text-8xl"><i class="fa-solid fa-xmark"></i></div>

            <div id="quiz-box" class="py-12 flex flex-col items-center">
                <div id="question-display" class="text-5xl md:text-6xl font-serif text-slate-800 mb-8 h-20 flex items-center justify-center"></div>
                <input type="number" step="any" id="answer-input" placeholder="정답 입력 후 엔터 ⏎" class="w-3/4 p-4 text-center text-xl bg-slate-50 border-b-2 border-teal-300 focus:outline-none focus:border-teal-500 focus:bg-white transition-all rounded-t-lg">
            </div>

            <div class="w-full bg-slate-100 rounded-full h-2 mt-4">
                <div id="progress-bar" class="bg-teal-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- 로딩 섹션 -->
        <div id="sec-loading" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-teal-50 text-center py-16">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-teal-100 border-t-teal-500 mb-4"></div>
            <h3 class="text-xl font-bold text-slate-700 mb-2">결과 분석 중...</h3>
            <p class="text-slate-500 text-sm">AI 선생님이 피드백을 작성하고 리포트를 구성하고 있어요.</p>
        </div>

        <!-- 결과 섹션 -->
        <div id="sec-result" class="hidden flex-col space-y-6 w-full">
            
            <!-- [핵심] 이 pdf-content 영역 전체가 A4 용지 형태로 캡처되어 PDF로 변환됩니다. -->
            <div id="pdf-content" class="bg-white">
                
                <!-- ====== PDF 1쪽 파트: 제목, 정보, 정오답표 ====== -->
                <div class="p-8">
                    <div class="text-center mb-8">
                        <h1 id="report-title" class="text-3xl font-bold text-teal-800 tracking-tight"></h1>
                        <div class="h-4"></div>
                        <div class="flex flex-wrap justify-center items-center gap-4 text-slate-600 font-medium">
                            <span id="report-correct"></span>
                            <span class="text-slate-300">|</span>
                            <span id="report-time"></span>
                            <span class="text-slate-300">|</span>
                            <span id="report-date"></span>
                        </div>
                    </div>

                    <div class="mb-6">
                        <table class="print-table">
                            <thead>
                                <tr>
                                    <th style="width: 10%;">번호</th>
                                    <th style="width: 30%;">문제</th>
                                    <th style="width: 25%;">나의 답</th>
                                    <th style="width: 20%;">정답</th>
                                    <th style="width: 15%;">결과</th>
                                </tr>
                            </thead>
                            <tbody id="result-table-body">
                                <!-- JS에서 동적 생성됨 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 페이지 넘김 마커 (PDF 출력 시 이 아랫부분은 2쪽으로 넘어갑니다) -->
                <div class="html2pdf__page-break"></div>

                <!-- ====== PDF 2쪽 파트: AI 피드백 ====== -->
                <div class="p-8 border-t-2 border-teal-50 sm:border-none">
                    <h2 class="text-2xl font-bold text-teal-700 mb-6 flex items-center">
                        <i class="fa-solid fa-chalkboard-user mr-3"></i>AI 선생님의 맞춤형 피드백
                    </h2>
                    <div id="ai-feedback-display" class="prose prose-teal max-w-none text-slate-700 p-6 bg-teal-50/50 rounded-xl border border-teal-100">
                        <!-- AI 피드백 내용 -->
                    </div>
                </div>
            </div>

            <!-- 하단 버튼 (이 부분은 PDF에 들어가지 않습니다) -->
            <div class="flex flex-col sm:flex-row gap-4 mt-6">
                <button id="pdf-download-btn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-sm transition-colors flex justify-center items-center text-lg">
                    <i class="fa-solid fa-file-pdf mr-2"></i>내 학습결과 리포트 PDF 다운로드
                </button>
                <button onclick="location.reload()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 rounded-xl shadow-sm transition-colors text-lg">
                    <i class="fa-solid fa-rotate-right mr-2"></i>다시 도전하기
                </button>
            </div>

            <!-- 명예의 전당 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-teal-50 mt-2">
                <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center"><i class="fa-solid fa-trophy text-yellow-400 mr-2"></i>명예의 전당 (TOP 30)</h3>
                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-sm text-left whitespace-nowrap">
                        <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                            <tr>
                                <th class="px-4 py-3 text-center">순위</th>
                                <th class="px-4 py-3">이름</th>
                                <th class="px-4 py-3 text-center">점수</th>
                                <th class="px-4 py-3 text-center">기록</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-body" class="divide-y divide-slate-100">
                            <!-- 랭킹 생성됨 -->
                        </tbody>
                    </table>
                </div>
                <button onclick="location.reload()" class="w-full mt-6 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-colors">
                    처음으로 돌아가기
                </button>
            </div>
        </div>

        <!-- 푸터 (제작자 표기) - 위치를 컨테이너 안으로 올려 박스들 바로 밑에 붙도록 수정 -->
        <div class="mt-8 text-center text-slate-400 text-sm font-medium tracking-wide">
            Made by Euna for Math Education
        </div>

    </div>

    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3"></audio>

    <script>
        function customAlert(message) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50';
            const box = document.createElement('div');
            box.className = 'bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 text-center';
            box.innerHTML = `
                <p class="text-slate-700 mb-6 font-medium">${message}</p>
                <button class="bg-teal-500 text-white px-6 py-3 rounded-xl font-bold hover:bg-teal-600 w-full transition-colors">확인</button>
            `;
            box.querySelector('button').onclick = () => document.body.removeChild(overlay);
            overlay.appendChild(box);
            document.body.appendChild(overlay);
        }

        // =========================================================
        // 백엔드 URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyltGb1x07L2MKia3PB5xM_5H55L91hIynOPk2_29-iGFlFXkkol_WFBAeE5GZidLQ/exec";
        // =========================================================
        
        let state = {
            student: {},
            questions: [],
            results: [],
            currentIndex: 0,
            startTime: null,
            timerInterval: null
        };

        function showSection(secId) {
            ['sec-login', 'sec-quiz', 'sec-loading', 'sec-result'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.add('hidden');
                el.classList.remove('flex');
                el.classList.remove('flex-col');
            });
            const target = document.getElementById(secId);
            target.classList.remove('hidden');
            
            if (secId === 'sec-result') {
                document.getElementById('main-container').classList.remove('max-w-md');
                document.getElementById('main-container').classList.add('max-w-4xl');
                target.classList.add('flex', 'flex-col');
            } else if (secId === 'sec-login' || secId === 'sec-quiz') {
                document.getElementById('main-container').classList.add('max-w-md');
                document.getElementById('main-container').classList.remove('max-w-4xl');
                target.classList.add('flex', 'flex-col');
            } else if (secId === 'sec-loading') {
                target.classList.add('block');
            }
        }

        function generateProblem(forcedForm) {
            const forms = ['a^n', '(-a)^n', '-a^n', '-(-a)^n', '-(-a^n)'];
            const form = forcedForm || forms[Math.floor(Math.random() * forms.length)];
            
            let base = Math.floor(Math.random() * 4) + 1;
            let baseText = base.toString();
            let n;

            if (base === 1) n = Math.floor(Math.random() * 2025) + 2;
            else if (base === 2) n = Math.floor(Math.random() * 9) + 2;
            else if (base === 3) n = Math.floor(Math.random() * 4) + 2;
            else if (base === 4) n = Math.floor(Math.random() * 3) + 2;

            let displayHtml, evalResult;
            switch(form) {
                case 'a^n': displayHtml = `${baseText}<sup>${n}</sup>`; evalResult = Math.pow(base, n); break;
                case '(-a)^n': displayHtml = `(-${baseText})<sup>${n}</sup>`; evalResult = Math.pow(-base, n); break;
                case '-a^n': displayHtml = `-${baseText}<sup>${n}</sup>`; evalResult = -Math.pow(base, n); break;
                case '-(-a)^n': displayHtml = `-(-${baseText})<sup>${n}</sup>`; evalResult = -Math.pow(-base, n); break;
                case '-(-a^n)': displayHtml = `-(-${baseText}<sup>${n}</sup>)`; evalResult = Math.pow(base, n); break;
            }

            return {
                question: displayHtml,
                answer: parseFloat(evalResult.toFixed(4)),
                rawQuestion: form.replace('a', baseText).replace('n', n)
            };
        }

        async function handleLogin() {
            const btn = document.getElementById('loginBtn');
            const data = {
                action: 'login',
                studentId: document.getElementById('studentId').value.trim(),
                studentName: document.getElementById('studentName').value.trim(),
                password: document.getElementById('studentPw').value.trim()
            };

            if (!data.studentId || !data.studentName || !data.password) {
                customAlert("정보를 모두 입력해주세요."); return;
            }

            btn.innerText = "확인 중..."; btn.disabled = true;

            try {
                const response = await fetch(GAS_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data) 
                });
                const result = await response.json();

                if (result.success) {
                    state.student = data;
                    state.student.loginTime = new Date().toLocaleString();
                    startQuiz();
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                    btn.innerText = "로그인 및 시작"; btn.disabled = false;
                }
            } catch (e) {
                customAlert("서버 통신 오류. 인터넷 연결을 확인하세요.");
                btn.innerText = "로그인 및 시작"; btn.disabled = false;
            }
        }

        function startQuiz() {
            let questionForms = ['a^n'];
            const negativeForms = ['(-a)^n', '-a^n', '-(-a)^n', '-(-a^n)'];
            for(let i = 0; i < 14; i++) questionForms.push(negativeForms[Math.floor(Math.random() * negativeForms.length)]);

            for (let i = questionForms.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [questionForms[i], questionForms[j]] = [questionForms[j], questionForms[i]];
            }

            state.questions = questionForms.map(form => generateProblem(form));
            state.currentIndex = 0;
            state.results = [];
            state.startTime = Date.now();
            
            showSection('sec-quiz');
            loadNextQuestion();

            state.timerInterval = setInterval(() => {
                const sec = Math.floor((Date.now() - state.startTime) / 1000);
                const m = String(Math.floor(sec / 60)).padStart(2, '0');
                const s = String(sec % 60).padStart(2, '0');
                document.getElementById('quiz-timer').innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${m}:${s}`;
            }, 1000);
        }

        function loadNextQuestion() {
            const q = state.questions[state.currentIndex];
            document.getElementById('q-idx').innerText = state.currentIndex + 1;
            document.getElementById('question-display').innerHTML = q.question;
            
            const input = document.getElementById('answer-input');
            input.value = ''; input.disabled = false; input.focus();
            
            const progress = (state.currentIndex / 15) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        document.getElementById('answer-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && this.value.trim() !== '') checkAnswer(this.value);
        });

        function checkAnswer(userStr) {
            const input = document.getElementById('answer-input');
            input.disabled = true;

            const userAnswer = parseFloat(userStr);
            const correctAnswer = state.questions[state.currentIndex].answer;
            const isCorrect = Math.abs(userAnswer - correctAnswer) < 0.0001;

            const stampCorrect = document.getElementById('stamp-correct');
            const stampWrong = document.getElementById('stamp-wrong');
            const quizBox = document.getElementById('quiz-box');

            if (isCorrect) {
                document.getElementById('sound-correct').play();
                stampCorrect.classList.add('stamp-show');
            } else {
                document.getElementById('sound-wrong').play();
                stampWrong.classList.add('stamp-show');
                quizBox.classList.add('shake-anim');
            }

            state.results.push({
                question: state.questions[state.currentIndex].question,
                userAnswer: userStr,
                correctAnswer: correctAnswer,
                isCorrect: isCorrect
            });

            setTimeout(() => {
                stampCorrect.classList.remove('stamp-show');
                stampWrong.classList.remove('stamp-show');
                quizBox.classList.remove('shake-anim');
                
                state.currentIndex++;
                if (state.currentIndex < 15) loadNextQuestion();
                else finishQuiz();
            }, 800);
        }

        async function finishQuiz() {
            clearInterval(state.timerInterval);
            showSection('sec-loading');

            const timeTaken = Math.floor((Date.now() - state.startTime) / 1000);
            const correctCount = state.results.filter(r => r.isCorrect).length;

            const finalData = {
                ...state.student,
                action: 'submit',
                timeTaken: timeTaken,
                correctCount: correctCount,
                quizResults: state.results
            };

            try {
                const response = await fetch(GAS_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(finalData) 
                });
                const result = await response.json();

                if (result.success) showResultView(result, timeTaken, correctCount);
                else customAlert("결과 저장 실패: " + result.error);
            } catch (e) {
                customAlert("오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
            }
        }

        function showResultView(data, time, correct) {
            showSection('sec-result');
            
            // 1. 상단 정보 렌더링
            const id = state.student.studentId || '학번미상';
            const name = state.student.studentName || '이름미상';
            document.getElementById('report-title').innerText = `${id} ${name} 학생의 (정수의 거듭제곱) 리포트`;
            
            document.getElementById('report-correct').innerHTML = `<i class="fa-solid fa-check text-teal-500 mr-2"></i>맞힌 개수: <span class="font-bold text-teal-700">${correct} / 15</span>`;
            document.getElementById('report-time').innerHTML = `<i class="fa-regular fa-clock text-slate-400 mr-2"></i>걸린 시간: <span class="font-bold text-slate-700">${time}초</span>`;
            document.getElementById('report-date').innerHTML = `<i class="fa-regular fa-calendar text-slate-400 mr-2"></i>접속 일시: <span class="font-bold text-slate-700">${state.student.loginTime}</span>`;

            // 2. 정오답표 렌더링
            const tbody = document.getElementById('result-table-body');
            tbody.innerHTML = '';
            state.results.forEach((r, idx) => {
                const isCorrectStr = r.isCorrect 
                    ? '<span style="color: #10b981; font-weight: bold; font-size: 1.1rem;">O</span>' 
                    : '<span style="color: #ef4444; font-weight: bold; font-size: 1.1rem;">X</span>';
                const userAnsStyle = r.isCorrect ? 'color: #334155;' : 'color: #ef4444; font-weight: bold;';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${idx + 1}</td>
                    <td style="font-size: 1.1rem;">${r.question}</td>
                    <td style="${userAnsStyle}">${r.userAnswer}</td>
                    <td>${r.correctAnswer}</td>
                    <td>${isCorrectStr}</td>
                `;
                tbody.appendChild(tr);
            });

            // 3. AI 피드백 렌더링 (지수 렌더링 완벽 처리)
            let feedbackText = data.feedback;
            if (!feedbackText) {
                feedbackText = "⚠️ AI 피드백을 생성하지 못했습니다.";
            }

            // --- [특수 처리] 학생 이름 다정하게 부르기 및 호칭(학생) 완벽 교정 ---
            const studentFullName = state.student.studentName || "";
            let firstName = "";
            let searchNames = [];

            if (studentFullName === '남궁준') {
                firstName = '준';
                searchNames = ['남궁준', '궁준'];
            } else if (studentFullName.length >= 2) {
                firstName = studentFullName.substring(1);
                searchNames = [studentFullName];
            } else if (studentFullName.length === 1) {
                firstName = studentFullName;
                searchNames = [studentFullName];
            }

            if (firstName) {
                searchNames.push(firstName);

                // 1. AI가 (전체이름+아/야) 또는 (이름+아/야) 라고 부른 경우 -> "OO 학생"으로 교정
                searchNames.forEach(name => {
                    const wrongCallRegex = new RegExp(name + '[아야]', 'g');
                    feedbackText = feedbackText.replace(wrongCallRegex, firstName + ' 학생');
                });

                // 2. 조사가 붙지 않은 나머지 풀네임 치환 (예: "김지수 학생은" -> "지수 학생은")
                searchNames.forEach(name => {
                    if(name !== firstName) {
                        const nameRegex = new RegExp(name, 'g');
                        feedbackText = feedbackText.replace(nameRegex, firstName);
                    }
                });
            }
            // ------------------------------------------

            // --- [특수 처리] 가독성을 위해 '설명:' 앞에서 강제 줄바꿈 ---
            // AI가 '정답: ~ 설명: ~' 형식으로 한 줄에 붙여서 보낸 경우, 강제로 두 줄 바꿈(\n\n)을 넣어 분리합니다.
            feedbackText = feedbackText.replace(/(정답:.*?)\s*(?:\*\*설명:\*\*|설명:)/g, '$1\n\n**설명:** ');
            // ------------------------------------------

            // 마크다운 문법을 HTML로 먼저 변환
            let feedbackHtml = marked.parse(feedbackText);

            // 처리 1. AI가 코드블록 때문에 <sup>태그를 그대로 노출시킨 경우(글자 &lt;sup&gt;)를 복구
            feedbackHtml = feedbackHtml.replace(/&lt;sup&gt;/gi, '<sup>').replace(/&lt;\/sup&gt;/gi, '</sup>');
            
            // 처리 2. AI가 ^ 뒤에 숫자나 알파벳 문자를 쓴 경우 모두 변환 (예: ^4, ^-2, ^15, ^n)
            feedbackHtml = feedbackHtml.replace(/\^([a-zA-Z0-9-]+)/g, '<sup>$1</sup>');
            
            // 처리 3. AI가 괄호를 이용한 경우 변환 (예: ^(4), ^(-2), ^(n))
            feedbackHtml = feedbackHtml.replace(/\^\(([^)]+)\)/g, '<sup>$1</sup>');

            document.getElementById('ai-feedback-display').innerHTML = feedbackHtml;

            // 4. 명예의 전당 렌더링
            const rankTbody = document.getElementById('ranking-body');
            rankTbody.innerHTML = '';
            if (data.leaderboard && Array.isArray(data.leaderboard) && data.leaderboard.length > 0) {
                data.leaderboard.forEach((r, idx) => {
                    let rankStyle = "text-slate-600";
                    if(idx === 0) rankStyle = "text-yellow-500 font-bold";
                    else if(idx === 1) rankStyle = "text-slate-400 font-bold";
                    else if(idx === 2) rankStyle = "text-amber-600 font-bold";

                    const row = `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-4 py-3 text-center ${rankStyle}">${idx + 1}</td>
                            <td class="px-4 py-3 font-medium text-slate-700">${r.name}</td>
                            <td class="px-4 py-3 text-center text-teal-600 font-bold">${r.correct}</td>
                            <td class="px-4 py-3 text-center text-slate-500 text-xs">${r.time}초</td>
                        </tr>
                    `;
                    rankTbody.innerHTML += row;
                });
            } else {
                rankTbody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400">데이터가 없습니다.</td></tr>`;
            }

            // 5. 백그라운드 PDF 자동 업로드
            if (data.rowId) {
                setTimeout(() => {
                    const element = document.getElementById('pdf-content');
                    const opt = {
                        margin:       [15, 10, 15, 10],
                        filename:     'temp.pdf',
                        // [최적화 수정] 백그라운드 업로드용 PDF의 압축률과 스케일을 낮춰 Payload Too Large 오류(Failed to fetch) 방지
                        image:        { type: 'jpeg', quality: 0.8 }, 
                        html2canvas:  { scale: 1, useCORS: true, letterRendering: true, scrollY: 0 }, 
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak:    { mode: 'css' }
                    };

                    html2pdf().set(opt).from(element).output('datauristring').then(async function(pdfAsString) {
                        const base64Data = pdfAsString.split(',')[1];
                        try {
                            await fetch(GAS_URL, {
                                method: 'POST',
                                mode: 'no-cors', // [최적화 수정] 큰 용량의 비동기 전송 시 CORS 차단으로 인한 통신 실패를 방지
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({
                                    action: 'uploadPdf',
                                    rowId: data.rowId,
                                    studentId: state.student.studentId,
                                    studentName: state.student.studentName,
                                    base64: base64Data
                                })
                            });
                        } catch(e) { console.error("백그라운드 PDF 업로드 실패", e); }
                    });
                }, 1500);
            }
        }

        // 학생용 로컬 PDF 다운로드 버튼
        document.getElementById('pdf-download-btn').addEventListener('click', function(e) {
            e.preventDefault();
            
            const pdfBtn = document.getElementById('pdf-download-btn');
            const originalContent = pdfBtn.innerHTML;
            pdfBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>PDF 생성 중...';
            pdfBtn.disabled = true;

            const element = document.getElementById('pdf-content');

            const opt = {
                margin:       [15, 10, 15, 10],
                filename:     `${state.student.studentId || '학번'}_${state.student.studentName || '이름'}_학습결과.pdf`,
                // 로컬 다운로드용은 고화질(scale: 2, quality: 0.98) 원본 화질 유지
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: 'css' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                pdfBtn.innerHTML = originalContent;
                pdfBtn.disabled = false;
            });
        });

        // 페이지 로드 시 학번 입력창에 자동으로 커서 깜빡이게 하기
        window.addEventListener('DOMContentLoaded', () => {
            const studentIdInput = document.getElementById('studentId');
            if(studentIdInput) {
                studentIdInput.focus();
            }
        });
    </script>
</body>
</html>
