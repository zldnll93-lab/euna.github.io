<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정수와 유리수의 거듭제곱 훈련소</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" crossorigin="anonymous">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'jua': ['Jua', 'sans-serif'] },
                    colors: {
                        mint: { 50: '#F0FDF4', 100: '#DCFCE7', 300: '#86EFAC', 500: '#22C55E', 700: '#15803D' },
                        pastel: { blue: '#BAE6FD', yellow: '#FEF08A', pink: '#FBCFE8' }
                    }
                }
            }
        }
    </script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            svg: { fontCache: 'none' },
            options: { enableMenu: false, renderActions: { assistiveMml: [] } },
            startup: { typeset: false }
        };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Jua', sans-serif; background-color: #F0FDF4; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .math-display { font-size: 2rem; padding: 1.5rem; background-color: white; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        #pdf-content { width: 100%; box-sizing: border-box; }
        .page-break-avoid, #result-table-body tr, .markdown-body p, .markdown-body li, .markdown-body h1, .markdown-body h2, .markdown-body h3 { page-break-inside: avoid; }
        .markdown-body p { margin-bottom: 1rem; line-height: 2.2; word-break: keep-all; text-align: justify; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-body mjx-container { display: inline-block !important; margin: 0 !important; }
        .markdown-body mjx-container[display="true"] { display: inline-block !important; margin: 0 !important; width: auto !important; text-align: left !important; }
    </style>
</head>
<body class="text-gray-800 min-h-screen flex flex-col items-center justify-center p-4">
    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxuR0ftea7Bt4H9R1dtOOjLuJWvI-Kg53xyZ1F7tibUQfAL-eoQ7_iiutCm9dGn0P_SJA/exec"; 
    </script>
    <div id="app" class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden relative fade-in">
        <div id="view-loading" class="p-8 text-center hidden">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-mint-500 mx-auto mb-4"></div>
            <h2 class="text-xl text-mint-700" id="loading-msg">로딩 중...</h2>
        </div>
        <div id="view-login" class="p-8 hidden fade-in">
            <h1 class="text-3xl text-center text-mint-700 mb-2">거듭제곱 훈련소 🚀</h1>
            <p class="text-center text-gray-500 mb-6">정수와 유리수 마스터하기!</p>
            <form id="login-form" class="space-y-4">
                <div><label class="block text-sm text-gray-600 mb-1">학번 (예: 10101)</label><input type="number" id="input-id" required class="w-full px-4 py-2 rounded-xl border-2 border-mint-100 focus:border-mint-500 focus:outline-none transition"></div>
                <div><label class="block text-sm text-gray-600 mb-1">이름</label><input type="text" id="input-name" required class="w-full px-4 py-2 rounded-xl border-2 border-mint-100 focus:border-mint-500 focus:outline-none transition"></div>
                <div><label class="block text-sm text-gray-600 mb-1">비밀번호</label><input type="password" id="input-pw" required class="w-full px-4 py-2 rounded-xl border-2 border-mint-100 focus:border-mint-500 focus:outline-none transition"></div>
                <button type="submit" class="w-full bg-mint-500 hover:bg-mint-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg mt-4">입장하기</button>
            </form>
        </div>
        <div id="view-quiz" class="p-6 hidden fade-in">
            <div class="flex justify-between items-center mb-6"><span class="bg-pastel-blue text-blue-800 px-3 py-1 rounded-full text-sm font-bold" id="quiz-progress">1 / 15</span><span class="text-gray-500 text-sm" id="quiz-timer">00:00</span></div>
            <div class="text-center mb-8 math-display min-h-[120px] flex items-center justify-center relative"><div id="math-problem"></div><div id="feedback-icon" class="absolute inset-0 flex items-center justify-center text-6xl opacity-0 transition-opacity duration-300 pointer-events-none"></div></div>
            <form id="answer-form" class="space-y-4"><input type="text" id="input-answer" placeholder="정답 입력 (분수는 1/2 형식)" required autocomplete="off" class="w-full text-center text-2xl px-4 py-3 rounded-xl border-2 border-mint-300 focus:border-mint-500 focus:outline-none transition"><button type="submit" class="w-full bg-mint-500 hover:bg-mint-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg">확인 (Enter)</button></form>
        </div>
    </div> 
    <div id="view-result" class="hidden fade-in bg-mint-50 min-h-screen w-full fixed inset-0 z-50 overflow-y-auto">
        <div class="w-full flex justify-center p-4 sm:p-8 pb-32">
            <div id="pdf-content" class="w-full max-w-3xl bg-white p-6 sm:p-10 shadow-sm rounded-xl">
                <div class="text-center mb-6 border-b-4 border-mint-300 pb-4 page-break-avoid"><h1 class="text-3xl text-mint-700 mb-2">훈련 완료! 🎉</h1><p class="text-gray-600" id="result-user-info"></p></div>
                <div class="grid grid-cols-2 gap-4 mb-6 page-break-avoid">
                    <div class="bg-pastel-yellow p-4 rounded-2xl text-center shadow"><p class="text-gray-600 text-sm">맞힌 문제</p><p class="text-3xl text-yellow-700"><span id="result-correct"></span> / 15</p></div>
                    <div class="bg-pastel-blue p-4 rounded-2xl text-center shadow"><p class="text-gray-600 text-sm">걸린 시간</p><p class="text-3xl text-blue-700" id="result-time"></p></div>
                </div>
                <h3 class="text-xl text-gray-800 mb-3 border-l-4 border-mint-500 pl-2 page-break-avoid">결과 요약표</h3>
                <div id="table-wrapper" class="overflow-x-auto mb-6"><table class="w-full text-sm text-center border-collapse"><thead><tr class="bg-mint-100"><th class="border p-2">번호</th><th class="border p-2">문제</th><th class="border p-2">입력한 답</th><th class="border p-2">정답</th><th class="border p-2">결과</th></tr></thead><tbody id="result-table-body"></tbody></table></div>
                <div id="ai-feedback-box" class="bg-gray-50 border border-gray-200 p-5 rounded-xl markdown-body text-gray-700 text-sm leading-relaxed mb-6"></div>
            </div>
        </div>
        <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-center gap-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] flex-wrap z-[60]">
            <button id="btn-retry" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-5 rounded-full shadow transition">다시 도전하기</button>
            <button id="btn-show-ranking" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 px-5 rounded-full shadow transition">순위표 보기</button>
            <button id="btn-download-img" class="bg-mint-500 hover:bg-mint-700 text-white font-bold py-2 px-5 rounded-full shadow transition flex items-center gap-2">이미지 다운로드</button>
        </div>
        <div id="ranking-modal" class="hidden fixed inset-0 bg-black/60 z-[110] flex items-center justify-center p-4 fade-in">
            <div class="bg-white rounded-2xl w-full max-w-lg p-6 max-h-[80vh] flex flex-col">
                <div class="flex justify-between items-center mb-4"><h3 class="text-xl text-gray-800 font-bold border-l-4 border-mint-500 pl-2">명예의 전당 (Top 30) 🏆</h3><button id="btn-close-ranking" class="text-gray-400 hover:text-gray-700 text-3xl leading-none">&times;</button></div>
                <div class="overflow-y-auto"><table class="w-full text-sm text-center border-collapse"><thead class="bg-yellow-100 text-yellow-800 sticky top-0"><tr><th class="py-2 border-b">순위</th><th class="py-2 border-b">이름</th><th class="py-2 border-b">정답</th><th class="py-2 border-b">시간</th><th class="py-2 border-b">접속 일시</th></tr></thead><tbody id="ranking-body"></tbody></table></div>
            </div>
        </div>
    </div>
    <script type="module">
        let state = { studentId: '', studentName: '', password: '', loginTime: '', problems: [], currentIdx: 0, results: [], startTime: 0, timerInterval: null };
        const el = { appContainer: document.getElementById('app'), viewLogin: document.getElementById('view-login'), viewQuiz: document.getElementById('view-quiz'), viewResult: document.getElementById('view-result'), viewLoading: document.getElementById('view-loading'), loadingMsg: document.getElementById('loading-msg'), loginForm: document.getElementById('login-form'), quizForm: document.getElementById('answer-form'), mathProblem: document.getElementById('math-problem'), inputAnswer: document.getElementById('input-answer'), feedbackIcon: document.getElementById('feedback-icon'), quizProgress: document.getElementById('quiz-progress'), quizTimer: document.getElementById('quiz-timer'), btnRetry: document.getElementById('btn-retry'), btnShowRanking: document.getElementById('btn-show-ranking'), btnCloseRanking: document.getElementById('btn-close-ranking'), rankingModal: document.getElementById('ranking-modal'), tableWrapper: document.getElementById('table-wrapper'), };
        function init() { showView(el.viewLogin); el.loginForm.addEventListener('submit', handleLogin); el.quizForm.addEventListener('submit', handleAnswerSubmit); document.getElementById('btn-download-img').addEventListener('click', downloadImage); el.btnRetry.addEventListener('click', startQuiz); el.btnShowRanking.addEventListener('click', () => el.rankingModal.classList.remove('hidden')); el.btnCloseRanking.addEventListener('click', () => el.rankingModal.classList.add('hidden')); }
        function showView(viewElement) { [el.viewLogin, el.viewQuiz, el.viewLoading].forEach(v => v.classList.add('hidden')); el.viewResult.classList.add('hidden'); if(viewElement === el.viewResult) { el.appContainer.classList.add('hidden'); } else { el.appContainer.classList.remove('hidden'); } viewElement.classList.remove('hidden'); }
        function showLoading(msg) { el.loadingMsg.innerText = msg; showView(el.viewLoading); }
        async function handleLogin(e) { e.preventDefault(); const id = document.getElementById('input-id').value; const name = document.getElementById('input-name').value; const pw = document.getElementById('input-pw').value; showLoading("로그인 확인 중..."); try { const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'login', studentId: id, studentName: name, password: pw }) }); const result = await response.json(); if (result.status === 'success') { state.studentId = id; state.studentName = name; state.password = pw; state.loginTime = new Date().toLocaleString(); startQuiz(); } else { alert(result.message); showView(el.viewLogin); } } catch (err) { alert("서버 통신 오류: " + err.message); showView(el.viewLogin); } }
        function generateProblems() { const problems = []; const fractions = [{n: 1, d: 2}, {n: -1, d: 2}, {n: 1, d: 3}, {n: -1, d: 3}, {n: 2, d: 3}, {n: -2, d: 3}, {n: 1, d: 4}, {n: -1, d: 4}, {n: 3, d: 4}, {n: -3, d: 4}, {n: 1, d: 5}, {n: -1, d: 5}, {n: 2, d: 5}, {n: -2, d: 5}, {n: 3, d: 2}]; let types = [1, 2, 3, 4, 5]; for (let i = 0; i < 10; i++) types.push(Math.floor(Math.random() * 4) + 2); for (let i = types.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [types[i], types[j]] = [types[j], types[i]]; } for (let i = 0; i < 15; i++) { let isFraction = Math.random() < 0.35; let baseNum, baseDen, baseAbs; if (isFraction) { let f = fractions[Math.floor(Math.random() * fractions.length)]; baseNum = Math.abs(f.n); baseDen = f.d; baseAbs = baseNum / baseDen; } else { baseNum = Math.floor(Math.random() * 6) + 1; baseDen = 1; baseAbs = baseNum; } let n; if (!isFraction && (baseAbs === 5 || baseAbs === 6)) n = Math.floor(Math.random() * 3) + 2; else if (!isFraction && baseAbs === 1) n = Math.floor(Math.random() * 2025) + 2; else if (isFraction) n = Math.floor(Math.random() * 3) + 2; else { if (baseAbs === 2) n = Math.floor(Math.random() * 9) + 2; else n = Math.floor(Math.random() * 4) + 2; } let type = types[i]; let answer = calculateAnswer(baseNum, baseDen, n, type); let tex = getProblemTex(baseNum, baseDen, n, type); problems.push({ tex, answer, type, baseNum, baseDen, n }); } return problems; }
        function calculateAnswer(baseNum, baseDen, n, type) { let resNum = BigInt(baseNum) ** BigInt(n); let resDen = BigInt(baseDen) ** BigInt(n); let sign = 1n; if (type === 1) sign = 1n; else if (type === 2) sign = (n % 2 === 0) ? 1n : -1n; else if (type === 3) sign = -1n; else if (type === 4) sign = (n % 2 === 0) ? -1n : 1n; else if (type === 5) sign = 1n; resNum = resNum * sign; return resDen === 1n ? resNum.toString() : `${resNum.toString()}/${resDen.toString()}`; }
        function getProblemTex(baseNum, baseDen, n, type) { let isFrac = (baseDen !== 1); let fracTex = isFrac ? `\\frac{${baseNum}}{${baseDen}}` : `${baseNum}`; let wrappedA = isFrac ? `\\left(${fracTex}\\right)` : fracTex; switch(type) { case 1: return `${wrappedA}^{${n}}`; case 2: return `\\left(-${fracTex}\\right)^{${n}}`; case 3: return `-${wrappedA}^{${n}}`; case 4: return `-\\left(-${fracTex}\\right)^{${n}}`; case 5: return `-\\left(-${wrappedA}^{${n}}\\right)`; } }
        function startQuiz() { state.problems = generateProblems(); state.currentIdx = 0; state.results = []; state.startTime = Date.now(); showView(el.viewQuiz); startTimer(); renderProblem(); }
        function startTimer() { clearInterval(state.timerInterval); state.timerInterval = setInterval(() => { const diff = Math.floor((Date.now() - state.startTime) / 1000); const m = String(Math.floor(diff / 60)).padStart(2, '0'); const s = String(diff % 60).padStart(2, '0'); el.quizTimer.innerText = `${m}:${s}`; }, 1000); }
        function renderProblem() { const p = state.problems[state.currentIdx]; el.quizProgress.innerText = `${state.currentIdx + 1} / 15`; el.mathProblem.innerHTML = `\\[ ${p.tex} \\]`; MathJax.typesetPromise([el.mathProblem]); el.inputAnswer.value = ''; el.inputAnswer.focus(); }
        function playSound(isCorrect) { const ctx = new (window.AudioContext || window.webkitAudioContext)(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); if (isCorrect) { osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, ctx.currentTime); osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); osc.start(); osc.stop(ctx.currentTime + 0.5); } else { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime); gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3); osc.start(); osc.stop(ctx.currentTime + 0.3); } }
        function handleAnswerSubmit(e) { e.preventDefault(); const userAns = el.inputAnswer.value.replace(/\s/g, ''); if(!userAns) return; const p = state.problems[state.currentIdx]; const isCorrect = (userAns === p.answer); state.results.push({ num: state.currentIdx + 1, tex: p.tex, user: userAns, answer: p.answer, correct: isCorrect }); playSound(isCorrect); el.feedbackIcon.innerHTML = isCorrect ? '✅' : '❌'; el.feedbackIcon.classList.remove('opacity-0'); el.feedbackIcon.classList.add('opacity-100'); setTimeout(() => { el.feedbackIcon.classList.remove('opacity-100'); el.feedbackIcon.classList.add('opacity-0'); state.currentIdx++; if (state.currentIdx < 15) renderProblem(); else finishQuiz(); }, 600); }
        async function finishQuiz() { clearInterval(state.timerInterval); const timeTaken = Math.floor((Date.now() - state.startTime) / 1000); const correctCount = state.results.filter(r => r.correct).length; showView(el.viewResult); window.scrollTo(0, 0); const overlay = document.createElement('div'); overlay.id = 'result-overlay'; overlay.className = 'fixed inset-0 bg-white/90 z-[100] flex flex-col items-center justify-center fade-in'; overlay.innerHTML = `<div class="animate-spin rounded-full h-16 w-16 border-b-4 border-mint-500 mb-4"></div><h2 class="text-xl text-mint-700 font-bold text-center" id="overlay-msg">피드백 가져오는 중...</h2>`; document.body.appendChild(overlay); try { renderResultUI(correctCount, timeTaken); await MathJax.typesetPromise(); const feedbackText = await getAIFeedback(state.results); document.getElementById('ai-feedback-box').innerHTML = marked.parse(feedbackText); await MathJax.typesetPromise([document.getElementById('ai-feedback-box')]); const element = document.getElementById('pdf-content'); element.classList.remove('shadow-sm', 'rounded-xl'); element.style.padding = '40px'; element.style.backgroundColor = '#ffffff'; if (el.tableWrapper) el.tableWrapper.style.overflow = 'visible'; await new Promise(r => setTimeout(r, 300)); const dataUrl = await window.htmlToImage.toPng(element, { quality: 1.0, pixelRatio: 2, backgroundColor: '#ffffff', width: element.scrollWidth, height: element.scrollHeight }); element.classList.add('shadow-sm', 'rounded-xl'); element.style.padding = ''; if (el.tableWrapper) el.tableWrapper.style.overflow = ''; const { jsPDF } = window.jspdf; const img = new Image(); img.src = dataUrl; await new Promise(resolve => { img.onload = resolve; }); const pdf = new jsPDF('p', 'mm', [210, (img.height * 210) / img.width]); pdf.addImage(dataUrl, 'JPEG', 0, 0, 210, (img.height * 210) / img.width); const base64Data = pdf.output('datauristring').split(',')[1]; await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'saveResult', studentId: state.studentId, studentName: state.studentName, correctCount: correctCount, timeTaken: timeTaken, loginTime: state.loginTime, pdfBase64: base64Data }) }); const rankRes = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getRanking' }) }); const rankData = await rankRes.json(); renderRanking(rankData.ranking); } catch (err) { alert("오류 발생: " + err.message); } finally { if (document.getElementById('result-overlay')) document.body.removeChild(document.getElementById('result-overlay')); } }
        function renderResultUI(correctCount, timeTaken) { const m = String(Math.floor(timeTaken / 60)).padStart(2, '0'); const s = String(timeTaken % 60).padStart(2, '0'); document.getElementById('result-user-info').innerText = `${state.studentId} ${state.studentName} | ${state.loginTime}`; document.getElementById('result-correct').innerText = correctCount; document.getElementById('result-time').innerText = `${m}분 ${s}초`; const tbody = document.getElementById('result-table-body'); tbody.innerHTML = ''; state.results.forEach(r => { const tr = document.createElement('tr'); tr.innerHTML = `<td class="border p-2">${r.num}</td><td class="border p-2 text-lg">\\( ${r.tex} \\)</td><td class="border p-2 font-mono ${r.correct ? 'text-green-600' : 'text-red-600'}">${r.user}</td><td class="border p-2 font-mono text-blue-600">${r.answer}</td><td class="border p-2 font-bold">${r.correct ? '✅' : '❌'}</td>`; tbody.appendChild(tr); }); }
        function renderRanking(ranking) { const tbody = document.getElementById('ranking-body'); tbody.innerHTML = ''; ranking.forEach(r => { const tr = document.createElement('tr'); if(r.studentId == state.studentId) tr.classList.add('bg-yellow-50', 'font-bold'); tr.innerHTML = `<td class="border-b py-2">${r.rank}등</td><td class="border-b py-2">${r.studentName}</td><td class="border-b py-2 text-green-600">${r.correctCount}</td><td class="border-b py-2 text-gray-500">${String(Math.floor(r.timeTaken/60)).padStart(2,'0')}:${String(r.timeTaken%60).padStart(2,'0')}</td><td class="border-b py-2 text-gray-400 text-xs">${r.loginTime || '-'}</td>`; tbody.appendChild(tr); }); }
        async function getAIFeedback(results) { const wrongAnswers = results.filter(r => !r.correct).map(r => `문제: ${r.tex}, 정답: ${r.answer}, 학생의 답: ${r.user}`).join('\n'); try { const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'getFeedback', studentName: state.studentName, correctCount: results.filter(r=>r.correct).length, wrongAnswers: wrongAnswers }) }); const data = await response.json(); return data.feedback.replace(/\$([^\$]+)\$/g, (m, p) => '$' + p.trim() + '$'); } catch (err) { return "피드백 생성 실패"; } }
        async function downloadImage() { const element = document.getElementById('pdf-content'); const dataUrl = await window.htmlToImage.toPng(element, { quality: 1.0, pixelRatio: 2, backgroundColor: '#ffffff', width: element.scrollWidth, height: element.scrollHeight }); const link = document.createElement('a'); link.download = `${state.studentId}_${state.studentName}_결과.png`; link.href = dataUrl; link.click(); }
        window.onload = init;
    </script>
</body>
</html>
