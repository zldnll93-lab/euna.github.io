<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유리수의 계산 마스터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.0/marked.min.js"></script>
    <!-- PDF 다운로드를 위한 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            background-color: #f0f4f9; /* 제미나이 느낌의 은은한 파스텔 하늘색 배경 */
            font-family: 'Pretendard', sans-serif;
            overflow-x: hidden;
        }
        
        /* 정오답 애니메이션 (도장 효과) */
        .stamp-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .stamp-show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) rotate(-10deg);
        }

        /* 퀴즈 박스 흔들림 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake-anim { animation: shake 0.4s ease-in-out; }

        /* 결과창 표 스타일 (PDF 변환 시 깨짐 방지 및 세로 높이 최적화) */
        .print-table {
            width: 100%;
            border-collapse: collapse;
        }
        .print-table th, .print-table td {
            border: 1px solid #cbd5e1;
            /* 표의 위아래 여백을 7px로 더 줄여 15문항이 1쪽 분량에 완벽히 맞춤 */
            padding: 7px 8px; 
            text-align: center;
        }
        .print-table th {
            background-color: #f8fafc;
            font-weight: 700;
            color: #475569;
        }
        .print-table td {
            color: #334155;
        }

        /* [핵심 복구 및 최적화] PDF 페이지 넘김 시 문장 중간이 잘리는 것 방지 */
        /* 제목이나 너무 큰 덩어리는 제외하고, 딱 문단(줄) 단위로만 보호하여 텅 빈 공간 유발 최소화 */
        #ai-feedback-display p, 
        #ai-feedback-display li {
            page-break-inside: avoid;
            break-inside: avoid;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- 최상위 컨테이너: 기본은 좁게(max-w-md), 결과창에서는 넓게(max-w-4xl) 동적 변경됨 -->
    <div id="main-container" class="w-full max-w-md mx-auto space-y-6 pb-4 transition-all duration-500 ease-in-out">
        
        <div class="text-center mt-6 mb-8">
            <h1 class="text-3xl font-bold text-sky-600 mb-2"><i class="fa-solid fa-calculator mr-2"></i>유리수 곱셈·나눗셈 마스터</h1>
            <p class="text-slate-500 text-sm">중학교 1학년 유리수의 계산 정복하기</p>
        </div>

        <!-- 로그인 섹션 -->
        <div id="sec-login" class="bg-white p-6 rounded-2xl shadow-sm border border-sky-50 flex flex-col space-y-4">
            <h2 class="text-xl font-bold text-slate-700 text-center mb-2">시작하기 전에</h2>
            <input type="text" id="studentId" autofocus placeholder="학번 (예: 10101)" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition-all">
            <input type="text" id="studentName" placeholder="이름" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition-all">
            <input type="password" id="studentPw" placeholder="비밀번호" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition-all">
            
            <button onclick="handleLogin()" id="loginBtn" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-4 rounded-xl mt-2 transition-colors">
                로그인 및 시작

        <!-- 퀴즈 섹션 -->

                <div id="quiz-timer" class="text-slate-400 font-mono"><i class="fa-regular fa-clock mr-1"></i>00:00</div>
            </div>

            <div id="stamp-correct" class="stamp-overlay text-emerald-500 text-8xl"><i class="fa-regular fa-circle"></i></div>
            <div id="stamp-wrong" class="stamp-overlay text-rose-500 text-8xl"><i class="fa-solid fa-xmark"></i></div>

            <div id="quiz-box" class="py-12 flex flex-col items-center">
                <!-- 분수 등 수식이 예쁘게 보이도록 font-serif 및 줄바꿈 방지 적용 -->
                <div id="question-display" class="text-4xl md:text-5xl font-serif text-slate-800 mb-8 h-20 flex items-center justify-center whitespace-nowrap"></div>
                <!-- [수정] 유리수(분수) 입력을 위해 type="number"에서 type="text"로 변경 -->
                <input type="text" id="answer-input" placeholder="정답 (분수는 / 사용, 예: -1/2) 입력 후 엔터 ⏎" class="w-full md:w-3/4 p-4 text-center text-lg bg-slate-50 border-b-2 border-sky-300 focus:outline-none focus:border-sky-500 focus:bg-white transition-all rounded-t-lg">
            </div>

            <div class="w-full bg-slate-100 rounded-full h-2 mt-4">
                <div id="progress-bar" class="bg-sky-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- 로딩 섹션 -->
        <div id="sec-loading" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-sky-50 text-center py-16">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-sky-100 border-t-sky-500 mb-4"></div>
            <h3 class="text-xl font-bold text-slate-700 mb-2">결과 분석 중...</h3>
            <p class="text-slate-500 text-sm">AI 선생님이 피드백을 작성하고 리포트를 구성하고 있어요.</p>
        </div>

        <!-- 결과 섹션 -->
        <div id="sec-result" class="hidden flex-col space-y-6 w-full">
            
            <!-- [핵심] 이 pdf-content 영역 전체가 A4 용지 형태로 캡처되어 PDF로 변환됩니다. -->
            <div id="pdf-content" class="bg-white">
                
                <!-- ====== PDF 1쪽 파트: 제목, 정보, 정오답표 ====== -->
                <div class="p-8">
                    <div class="text-center mb-6">
                        <h1 id="report-title" class="text-3xl font-bold text-sky-800 tracking-tight"></h1>
                        <div class="h-2"></div>
                        <div class="flex flex-wrap justify-center items-center gap-4 text-slate-600 font-medium">
                            <span id="report-correct"></span>
                            <span class="text-slate-300">|</span>
                            <span id="report-time"></span>
                            <span class="text-slate-300">|</span>
                            <span id="report-date"></span>
                        </div>
                    </div>

                    <div class="mb-6">
                        <table class="print-table">
                            <thead>
                                <tr>
                                    <th style="width: 10%;">번호</th>
                                    <th style="width: 35%;">문제</th>
                                    <th style="width: 20%;">나의 답</th>
                                    <th style="width: 20%;">정답</th>
                                    <th style="width: 15%;">결과</th>
                                </tr>
                            </thead>
                            <tbody id="result-table-body">
                                <!-- JS에서 동적 생성됨 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 페이지 넘김 마커 (PDF 출력 시 이 아랫부분은 2쪽으로 넘어갑니다) -->
                <div class="html2pdf__page-break"></div>

                <!-- ====== PDF 2쪽 파트: AI 피드백 ====== -->
                <div class="p-8 border-t-2 border-sky-50 sm:border-none">
                    <h2 class="text-2xl font-bold text-sky-700 mb-6 flex items-center">
                        <i class="fa-solid fa-chalkboard-user mr-3"></i>AI 선생님의 맞춤형 피드백
                    </h2>
                    <div id="ai-feedback-display" class="prose prose-sky max-w-none text-slate-700 p-6 bg-sky-50/50 rounded-xl border border-sky-100">
                        <!-- AI 피드백 내용 -->
                    </div>
                </div>
            </div>

            <!-- 하단 버튼 (이 부분은 PDF에 들어가지 않습니다) -->
            <div class="flex flex-col sm:flex-row gap-4 mt-6">
                <button id="pdf-download-btn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 rounded-xl shadow-sm transition-colors flex justify-center items-center text-lg">
                    <i class="fa-solid fa-file-pdf mr-2"></i>내 학습결과 리포트 PDF 다운로드
                </button>
                <button onclick="location.reload()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-4 rounded-xl shadow-sm transition-colors text-lg">
                    <i class="fa-solid fa-rotate-right mr-2"></i>다시 도전하기
                </button>
            </div>

            <!-- 명예의 전당 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-sky-50 mt-2">
                <h3 class="text-lg font-bold text-slate-700 mb-4 flex items-center"><i class="fa-solid fa-trophy text-yellow-400 mr-2"></i>명예의 전당 (TOP 30)</h3>
                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table class="w-full text-sm text-left whitespace-nowrap">
                        <thead class="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                            <tr>
                                <th class="px-4 py-3 text-center">순위</th>
                                <th class="px-4 py-3">이름</th>
                                <th class="px-4 py-3 text-center">점수</th>
                                <th class="px-4 py-3 text-center">기록</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-body" class="divide-y divide-slate-100">
                            <!-- 랭킹 생성됨 -->
                        </tbody>
                    </table>
                </div>
                <button onclick="location.reload()" class="w-full mt-6 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-colors">
                    처음으로 돌아가기
                </button>
            </div>
        </div>

        <!-- 푸터 (제작자 표기) - 위치를 컨테이너 안으로 올려 박스들 바로 밑에 붙도록 수정 -->
        <div class="mt-8 text-center text-slate-400 text-sm font-medium tracking-wide">
            Made by Euna for Math Education
        </div>

    </div>

    <audio id="sound-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="sound-wrong" src="https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3"></audio>

    <script>
        function customAlert(message) {
            const overlay = document.createElement('div');
            overlay.className = 'fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50';
            const box = document.createElement('div');
            box.className = 'bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 text-center';
            box.innerHTML = `
                <p class="text-slate-700 mb-6 font-medium">${message}</p>
                <button class="bg-sky-500 text-white px-6 py-3 rounded-xl font-bold hover:bg-sky-600 w-full transition-colors">확인</button>
            `;
            box.querySelector('button').onclick = () => document.body.removeChild(overlay);
            overlay.appendChild(box);
            document.body.appendChild(overlay);
        }

        // =========================================================
        // 백엔드 URL (선생님께서 새로 알려주신 URL 적용 완료)
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxUca42zpEhsPUpoCw1hI1ZKuutEL9PDshd4D45M66hPIb-Xu1xpSt7Vy7NvdsyZ3G9hA/exec";
        // =========================================================
        
        let state = {
            student: {},
            questions: [],
            results: [],
            currentIndex: 0,
            startTime: null,
            timerInterval: null
        };

        function showSection(secId) {
            ['sec-login', 'sec-quiz', 'sec-loading', 'sec-result'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.add('hidden');
                el.classList.remove('flex');
                el.classList.remove('flex-col');
            });
            const target = document.getElementById(secId);
            target.classList.remove('hidden');
            
            if (secId === 'sec-result') {
                document.getElementById('main-container').classList.remove('max-w-md');
                document.getElementById('main-container').classList.add('max-w-4xl');
                target.classList.add('flex', 'flex-col');
            } else if (secId === 'sec-login' || secId === 'sec-quiz') {
                document.getElementById('main-container').classList.add('max-w-md');
                document.getElementById('main-container').classList.remove('max-w-4xl');
                target.classList.add('flex', 'flex-col');
            } else if (secId === 'sec-loading') {
                target.classList.add('block');
            }
        }

        // --- [핵심 수정] 정수와 유리수의 곱셈 나눗셈 문제 생성 로직 (제한 로직 추가) ---
        function generateProblem(isBothPositive, counts) {
            counts = counts || { leftPlus1: 0, leftMinus1: 0, rightPlus1: 0 };
            const isMultiplication = Math.random() < 0.5; // 50% 확률로 곱셈/나눗셈
            
            // 기약분수 생성 함수
            const getIrreducibleFraction = () => {
                const denominators = [1, 2, 3, 4, 5, 6, 7, 8, 9]; 
                let d = denominators[Math.floor(Math.random() * denominators.length)];
                let n = Math.floor(Math.random() * 9) + 1; // 1~9
                
                const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
                const g = gcd(n, d);
                return { n: n / g, d: d / g };
            };

            let frac1, frac2, sign1, sign2;
            let isValid = false;

            // +1, -1 중복 출제를 막기 위해 조건을 만족할 때까지 문제를 다시 생성합니다.
            while (!isValid) {
                frac1 = getIrreducibleFraction();
                frac2 = getIrreducibleFraction();
                
                // 부호 결정 (isBothPositive에 따라)
                if (isBothPositive) {
                    sign1 = 1;
                    sign2 = 1;
                } else {
                    const signs = [ [1, -1], [-1, 1], [-1, -1] ];
                    const selectedSigns = signs[Math.floor(Math.random() * signs.length)];
                    sign1 = selectedSigns[0];
                    sign2 = selectedSigns[1];
                }

                // 현재 생성된 수식 판별
                let isLeftPlus1 = (frac1.n === 1 && frac1.d === 1 && sign1 === 1);
                let isLeftMinus1 = (frac1.n === 1 && frac1.d === 1 && sign1 === -1);
                let isRightPlus1 = (frac2.n === 1 && frac2.d === 1 && sign2 === 1);

                // 연산 기호 앞에 나오는 +1과 -1은 전체 문제 중 최대 1번까지만 허용 (2번 이상 불가)
                if (isLeftPlus1 && counts.leftPlus1 >= 1) continue;
                if (isLeftMinus1 && counts.leftMinus1 >= 1) continue;
                
                // 연산 기호 뒤(위)에 나오는 +1은 전체 문제 중 최대 1번까지만 허용 (2번 이상 불가)
                if (isRightPlus1 && counts.rightPlus1 >= 1) continue;

                // 모든 조건을 만족하면 루프 탈출 및 카운트 증가
                isValid = true;
                if (isLeftPlus1) counts.leftPlus1++;
                if (isLeftMinus1) counts.leftMinus1++;
                if (isRightPlus1) counts.rightPlus1++;
            }
            
            // 문제 화면 표시용 (가로선 분수)
            const formatFracHtml = (n, d, sign) => {
                let signStr = sign > 0 ? '+' : '-';
                if (d === 1) {
                    return `(${signStr}${n})`;
                } else {
                    return `(${signStr}<span class="inline-flex flex-col items-center justify-center mx-1" style="font-size: 0.85em; line-height: 1; vertical-align: middle; transform: translateY(-0.1em);">
                        <span class="px-1" style="padding-bottom: 3px;">${n}</span>
                        <span class="border-t-[1.5px] border-slate-800 w-full block"></span>
                        <span class="px-1" style="padding-top: 3px;">${d}</span>
                    </span>)`;
                }
            };

            // AI 전달 및 텍스트 기록용 (일반 슬래시 분수)
            const formatFracText = (n, d, sign) => {
                let signStr = sign > 0 ? '+' : '-';
                if (d === 1) {
                    return `(${signStr}${n})`;
                } else {
                    return `(${signStr}${n}/${d})`;
                }
            };

            const displayHtml1 = formatFracHtml(frac1.n, frac1.d, sign1);
            const displayHtml2 = formatFracHtml(frac2.n, frac2.d, sign2);
            
            const displayText1 = formatFracText(frac1.n, frac1.d, sign1);
            const displayText2 = formatFracText(frac2.n, frac2.d, sign2);
            
            let val1 = (frac1.n / frac1.d) * sign1;
            let val2 = (frac2.n / frac2.d) * sign2;
            let answerVal = isMultiplication ? (val1 * val2) : (val1 / val2);
            
            // 정답 분자/분모 계산 (기약분수화)
            let ansN = isMultiplication ? (frac1.n * frac2.n) : (frac1.n * frac2.d);
            let ansD = isMultiplication ? (frac1.d * frac2.d) : (frac1.d * frac2.n);
            let ansSign = sign1 * sign2;
            
            const gcd = (a, b) => b === 0 ? a : gcd(b, a % b);
            const g = Math.abs(gcd(ansN, ansD));
            ansN /= g;
            ansD /= g;

            let correctStr = "";
            if (ansN === 0) {
                correctStr = "0";
            } else {
                let prefix = ansSign > 0 ? "" : "-";
                correctStr = ansD === 1 ? `${prefix}${ansN}` : `${prefix}${ansN}/${ansD}`;
            }
            
            let opHtml = isMultiplication ? '<span class="mx-2">×</span>' : '<span class="mx-2">÷</span>';
            let opText = isMultiplication ? ' × ' : ' ÷ ';
            
            return {
                questionHtml: displayHtml1 + opHtml + displayHtml2,
                questionText: displayText1 + opText + displayText2,
                answerVal: answerVal,
                correctAnswerStr: correctStr
            };
        }

        async function handleLogin() {
            const btn = document.getElementById('loginBtn');
            const data = {
                action: 'login',
                studentId: document.getElementById('studentId').value.trim(),
                studentName: document.getElementById('studentName').value.trim(),
                password: document.getElementById('studentPw').value.trim()
            };

            if (!data.studentId || !data.studentName || !data.password) {
                customAlert("정보를 모두 입력해주세요."); return;
            }

            btn.innerText = "확인 중..."; btn.disabled = true;

            try {
                const response = await fetch(GAS_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(data) 
                });
                const result = await response.json();

                if (result.success) {
                    state.student = data;
                    state.student.loginTime = new Date().toLocaleString();
                    startQuiz();
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                    btn.innerText = "로그인 및 시작"; btn.disabled = false;
                }
            } catch (e) {
                customAlert("서버 통신 오류. 인터넷 연결을 확인하세요.");
                btn.innerText = "로그인 및 시작"; btn.disabled = false;
            }
        }

        function startQuiz() {
            // [수정] 양수*양수 1문제, 나머지 14문제는 (양음, 음양, 음음) 중 출제
            let types = [true, ...Array(14).fill(false)];
            for (let i = types.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [types[i], types[j]] = [types[j], types[i]];
            }

            // [+1, -1] 제한을 위해 카운트 객체를 생성하여 넘겨줍니다.
            let issueCounts = { leftPlus1: 0, leftMinus1: 0, rightPlus1: 0 };
            state.questions = types.map(isBothPositive => generateProblem(isBothPositive, issueCounts));
            
            state.currentIndex = 0;
            state.results = [];
            state.startTime = Date.now();
            
            showSection('sec-quiz');
            loadNextQuestion();

            state.timerInterval = setInterval(() => {
                const sec = Math.floor((Date.now() - state.startTime) / 1000);
                const m = String(Math.floor(sec / 60)).padStart(2, '0');
                const s = String(sec % 60).padStart(2, '0');
                document.getElementById('quiz-timer').innerHTML = `<i class="fa-regular fa-clock mr-1"></i>${m}:${s}`;
            }, 1000);
        }

        function loadNextQuestion() {
            const q = state.questions[state.currentIndex];
            document.getElementById('q-idx').innerText = state.currentIndex + 1;
            document.getElementById('question-display').innerHTML = q.questionHtml;
            
            const input = document.getElementById('answer-input');
            input.value = ''; input.disabled = false; input.focus();
            
            const progress = (state.currentIndex / 15) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        // 학생이 입력한 분수형 문자열(예: -3/8)을 소수점 값으로 변환하는 함수
        function parseAnswer(str) {
            str = str.replace(/\s+/g, ''); // 공백 제거
            if(str.includes('/')) {
                let parts = str.split('/');
                if(parts.length === 2) {
                    return parseFloat(parts[0]) / parseFloat(parts[1]);
                }
            }
            return parseFloat(str);
        }

        document.getElementById('answer-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && this.value.trim() !== '') checkAnswer(this.value);
        });

        function checkAnswer(userStr) {
            const input = document.getElementById('answer-input');
            input.disabled = true;

            const userAnswerVal = parseAnswer(userStr);
            const correctAnswerVal = state.questions[state.currentIndex].answerVal;
            
            // NaN 방지 및 실수 계산 오차 허용(0.0001)하여 정오답 판별
            const isCorrect = !isNaN(userAnswerVal) && Math.abs(userAnswerVal - correctAnswerVal) < 0.0001;

            const stampCorrect = document.getElementById('stamp-correct');
            const stampWrong = document.getElementById('stamp-wrong');
            const quizBox = document.getElementById('quiz-box');

            if (isCorrect) {
                document.getElementById('sound-correct').play();
                stampCorrect.classList.add('stamp-show');
            } else {
                document.getElementById('sound-wrong').play();
                stampWrong.classList.add('stamp-show');
                quizBox.classList.add('shake-anim');
            }

            state.results.push({
                question: state.questions[state.currentIndex].questionText, // AI 분석용 텍스트
                questionHtml: state.questions[state.currentIndex].questionHtml, // 결과창 표기용 HTML
                userAnswer: userStr, // 학생이 입력한 문자 그대로 기록 (예: -3/8)
                correctAnswer: state.questions[state.currentIndex].correctAnswerStr, // 정답도 분수 형태로 기록 (예: -3/2)
                isCorrect: isCorrect
            });

            setTimeout(() => {
                stampCorrect.classList.remove('stamp-show');
                stampWrong.classList.remove('stamp-show');
                quizBox.classList.remove('shake-anim');
                
                state.currentIndex++;
                if (state.currentIndex < 15) loadNextQuestion();
                else finishQuiz();
            }, 800);
        }

        async function finishQuiz() {
            clearInterval(state.timerInterval);
            showSection('sec-loading');

            const timeTaken = Math.floor((Date.now() - state.startTime) / 1000);
            const correctCount = state.results.filter(r => r.isCorrect).length;

            const finalData = {
                ...state.student,
                action: 'submit',
                timeTaken: timeTaken,
                correctCount: correctCount,
                quizResults: state.results
            };

            try {
                const response = await fetch(GAS_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(finalData) 
                });
                const result = await response.json();

                if (result.success) showResultView(result, timeTaken, correctCount);
                else customAlert("결과 저장 실패: " + result.error);
            } catch (e) {
                customAlert("오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
            }
        }

        function showResultView(data, time, correct) {
            showSection('sec-result');
            
            // 1. 상단 정보 렌더링 (절대 유지)
            const id = state.student.studentId || '학번미상';
            const name = state.student.studentName || '이름미상';
            document.getElementById('report-title').innerText = `${id} ${name} 학생의 학습 결과 리포트`;
            
            document.getElementById('report-correct').innerHTML = `<i class="fa-solid fa-check text-sky-500 mr-2"></i>맞힌 개수: <span class="font-bold text-sky-700">${correct} / 15</span>`;
            document.getElementById('report-time').innerHTML = `<i class="fa-regular fa-clock text-slate-400 mr-2"></i>걸린 시간: <span class="font-bold text-slate-700">${time}초</span>`;
            document.getElementById('report-date').innerHTML = `<i class="fa-regular fa-calendar text-slate-400 mr-2"></i>접속 일시: <span class="font-bold text-slate-700">${state.student.loginTime}</span>`;

            // 2. 정오답표 렌더링 (절대 유지)
            const tbody = document.getElementById('result-table-body');
            tbody.innerHTML = '';
            state.results.forEach((r, idx) => {
                const isCorrectStr = r.isCorrect 
                    ? '<span style="color: #10b981; font-weight: bold; font-size: 1.1rem;">O</span>' 
                    : '<span style="color: #ef4444; font-weight: bold; font-size: 1.1rem;">X</span>';
                const userAnsStyle = r.isCorrect ? 'color: #334155;' : 'color: #ef4444; font-weight: bold;';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="vertical-align: middle;">${idx + 1}</td>
                    <td style="font-size: 1.1rem; font-family: serif; vertical-align: middle;">${r.questionHtml}</td>
                    <td style="${userAnsStyle} vertical-align: middle;">${r.userAnswer}</td>
                    <td style="font-family: serif; vertical-align: middle;">${r.correctAnswer}</td>
                    <td style="vertical-align: middle;">${isCorrectStr}</td>
                `;
                tbody.appendChild(tr);
            });

            // 3. AI 피드백 렌더링
            let feedbackText = data.feedback;
            if (!feedbackText) {
                feedbackText = "⚠️ AI 피드백을 생성하지 못했습니다.";
            }

            // --- [특수 처리] 학생 이름 다정하게 부르기 및 호칭(학생) 완벽 교정 (절대 유지) ---
            const studentFullName = state.student.studentName || "";
            let firstName = "";
            let searchNames = [];

            if (studentFullName === '남궁준') {
                firstName = '준';
                searchNames = ['남궁준', '궁준'];
            } else if (studentFullName.length >= 2) {
                firstName = studentFullName.substring(1);
                searchNames = [studentFullName];
            } else if (studentFullName.length === 1) {
                firstName = studentFullName;
                searchNames = [studentFullName];
            }

            if (firstName) {
                searchNames.push(firstName);
                searchNames.forEach(name => {
                    const wrongCallRegex = new RegExp(name + '[아야]', 'g');
                    feedbackText = feedbackText.replace(wrongCallRegex, firstName + ' 학생');
                });
                searchNames.forEach(name => {
                    if(name !== firstName) {
                        const nameRegex = new RegExp(name, 'g');
                        feedbackText = feedbackText.replace(nameRegex, firstName);
                    }
                });
            }
            // ------------------------------------------

            // --- [특수 처리] 가독성을 위해 '설명:' 앞에서 강제 줄바꿈 (절대 유지) ---
            feedbackText = feedbackText.replace(/(정답:.*?)\s*(?:\*\*설명:\*\*|설명:)/g, '$1\n\n**설명:** ');
            // ------------------------------------------

            // 마크다운 문법을 HTML로 변환
            let feedbackHtml = marked.parse(feedbackText);

            // --- [마법의 특수 처리] 피드백 본문 내의 텍스트 분수(예: 3/4, -5/8)를 표와 똑같은 수학 수식(가로선) 모양으로 완벽하게 변환 ---
            // 정규식을 통해 숫자/숫자 형태만 골라내어 예쁜 flexbox 분수로 갈아끼웁니다. 날짜나 일반 텍스트는 건드리지 않습니다.
            feedbackHtml = feedbackHtml.replace(/(^|[^0-9a-zA-Z/])([-+]?)\s*(\d+)\s*\/\s*(\d+)(?=[^0-9a-zA-Z/]|$)/g, function(match, prefix, sign, n, d) {
                return `${prefix}${sign}<span class="inline-flex flex-col items-center justify-center mx-1" style="font-family: serif; font-size: 0.85em; line-height: 1; vertical-align: middle; transform: translateY(-0.1em);">
                    <span class="px-1" style="padding-bottom: 3px;">${n}</span>
                    <span class="border-t-[1.5px] border-slate-800 w-full block"></span>
                    <span class="px-1" style="padding-top: 3px;">${d}</span>
                </span>`;
            });
            // ------------------------------------------

            document.getElementById('ai-feedback-display').innerHTML = feedbackHtml;

            // 4. 명예의 전당 렌더링
            const rankTbody = document.getElementById('ranking-body');
            rankTbody.innerHTML = '';
            if (data.leaderboard && Array.isArray(data.leaderboard) && data.leaderboard.length > 0) {
                data.leaderboard.forEach((r, idx) => {
                    let rankStyle = "text-slate-600";
                    if(idx === 0) rankStyle = "text-yellow-500 font-bold";
                    else if(idx === 1) rankStyle = "text-slate-400 font-bold";
                    else if(idx === 2) rankStyle = "text-amber-600 font-bold";

                    const row = `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-4 py-3 text-center ${rankStyle}">${idx + 1}</td>
                            <td class="px-4 py-3 font-medium text-slate-700">${r.name}</td>
                            <td class="px-4 py-3 text-center text-sky-600 font-bold">${r.correct}</td>
                            <td class="px-4 py-3 text-center text-slate-500 text-xs">${r.time}초</td>
                        </tr>
                    `;
                    rankTbody.innerHTML += row;
                });
            } else {
                rankTbody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-slate-400">데이터가 없습니다.</td></tr>`;
            }

            // 5. 백그라운드 PDF 자동 업로드 (절대 유지)
            if (data.rowId) {
                setTimeout(() => {
                    const element = document.getElementById('pdf-content');
                    const opt = {
                        margin:       [15, 10, 15, 10],
                        filename:     'temp.pdf',
                        image:        { type: 'jpeg', quality: 0.8 }, 
                        html2canvas:  { scale: 1, useCORS: true, letterRendering: true, scrollY: 0 }, 
                        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak:    { mode: 'css' }
                    };

                    html2pdf().set(opt).from(element).output('datauristring').then(async function(pdfAsString) {
                        const base64Data = pdfAsString.split(',')[1];
                        try {
                            await fetch(GAS_URL, {
                                method: 'POST',
                                mode: 'no-cors', 
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({
                                    action: 'uploadPdf',
                                    rowId: data.rowId,
                                    studentId: state.student.studentId,
                                    studentName: state.student.studentName,
                                    base64: base64Data
                                })
                            });
                        } catch(e) { console.error("백그라운드 PDF 업로드 실패", e); }
                    });
                }, 1500);
            }
        }

        // 학생용 로컬 PDF 다운로드 버튼 (절대 유지)
        document.getElementById('pdf-download-btn').addEventListener('click', function(e) {
            e.preventDefault();
            
            const pdfBtn = document.getElementById('pdf-download-btn');
            const originalContent = pdfBtn.innerHTML;
            pdfBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>PDF 생성 중...';
            pdfBtn.disabled = true;

            const element = document.getElementById('pdf-content');

            const opt = {
                margin:       [15, 10, 15, 10],
                filename:     `${state.student.studentId || '학번'}_${state.student.studentName || '이름'}_학습결과.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true, scrollY: 0 },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: 'css' }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                pdfBtn.innerHTML = originalContent;
                pdfBtn.disabled = false;
            });
        });

        // 페이지 로드 시 학번 입력창에 자동으로 커서 깜빡이게 하기
        window.addEventListener('DOMContentLoaded', () => {
            const studentIdInput = document.getElementById('studentId');
            if(studentIdInput) {
                studentIdInput.focus();
            }
        });
    </script>
</body>
</html>
