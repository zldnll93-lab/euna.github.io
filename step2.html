<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정수 연산 마스터 PRO</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Prevent default arrows on number inputs */
    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center p-4">

<header class="w-full max-w-5xl flex items-center gap-3 py-6 mb-4">
  <div class="bg-blue-600 p-2 rounded-xl text-white">
    <i data-lucide="sigma" class="w-6 h-6"></i>
  </div>
  <h1 class="text-2xl font-black text-slate-800 tracking-tight">정수 연산 마스터 <span class="text-blue-600">PRO</span></h1>
</header>

<div id="app" class="w-full max-w-5xl">

  <div id="view-login" class="flex flex-col items-center w-full max-w-md mx-auto">
    <div class="bg-white w-full rounded-3xl p-8 sm:p-10 shadow-sm border border-slate-200">
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-sky-100 text-sky-600 mb-4">
          <i data-lucide="sparkles" class="w-8 h-8"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 tracking-tight">정수 연산 마스터</h2>
        <p class="text-slate-500 mt-2">오늘도 즐겁게 수학을 탐험해봐요!</p>
      </div>

      <form id="login-form" class="space-y-4">
        <label class="sr-only">학번</label>
        <div class="relative">
          <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
          <input type="text" id="login-id" placeholder="학번 (예: 10101)" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all font-medium">
        </div>
        
        <label class="sr-only">이름</label>
        <div class="relative">
          <input type="text" id="login-name" placeholder="이름을 알려주세요" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all font-medium">
        </div>
        
        <label class="sr-only">비밀번호</label>
        <div class="relative">
          <i data-lucide="key-round" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
          <input type="password" id="login-pw" placeholder="비밀번호" class="w-full pl-12 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all font-medium">
        </div>
        
        <p id="login-error" class="text-rose-500 text-sm font-medium pt-1 text-center min-h-[20px]"></p>

        <div class="pt-4">
          <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-4 font-bold text-lg transition-all flex justify-center items-center">
            <span id="login-btn-text">학습 시작하기</span>
            <i data-lucide="loader-2" id="login-spinner" class="ml-2 w-5 h-5 animate-spin hidden"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="view-quiz" class="hidden w-full flex-col grid-cols-1 lg:grid-cols-12 gap-8 max-w-5xl mx-auto">
    <div class="lg:col-span-8 flex flex-col gap-6 w-full">
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-xs font-bold text-slate-400 uppercase">진행도</p>
          <div class="flex justify-between items-end mt-1">
            <p class="text-2xl font-black text-slate-800"><span id="quiz-progress-text">01</span><span class="text-sm text-slate-400">/15</span></p>
          </div>
        </div>
        <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-xs font-bold text-slate-400 uppercase">소요 시간</p>
          <p class="text-2xl font-black text-slate-800"><span id="quiz-timer">0.0</span></p>
        </div>
        <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
          <p class="text-xs font-bold text-slate-400 uppercase">정답 수</p>
          <p class="text-2xl font-black text-emerald-600" id="quiz-correct-count">0</p>
        </div>
      </div>

      <div class="flex-1 bg-white rounded-3xl border border-slate-200 shadow-lg flex flex-col items-center justify-center relative overflow-hidden min-h-[400px]">
        <div class="absolute -top-20 -right-20 w-64 h-64 bg-slate-50 rounded-full pointer-events-none"></div>
        <div class="z-10 text-center w-full max-w-md px-6">
          <div id="quiz-level-text" class="inline-block px-4 py-1.5 bg-blue-50 text-blue-600 rounded-full text-xs font-bold mb-8 uppercase tracking-widest">
            Level
          </div>
          
          <div class="transition-all duration-300 transform scale-100 opacity-100" id="quiz-question-container">
            <div id="quiz-question-text" class="text-2xl sm:text-3xl font-black text-slate-800 mb-10 tracking-widest whitespace-nowrap">
              (+5) × (+3) = <span class="text-slate-300">?</span>
            </div>
          </div>
          
          <form id="quiz-form" class="w-full relative">
            <input type="text" id="quiz-answer-input" placeholder="정답을 입력하세요..." autocomplete="off" class="w-full px-6 py-4 sm:py-5 bg-slate-50 border-2 border-slate-200 rounded-2xl focus:outline-none focus:border-slate-800 transition-all text-center font-black text-lg">
            <button type="submit" id="quiz-submit-btn" class="w-full mt-4 h-16 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold transition-all disabled:opacity-50">
              정답 제출하기
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="lg:col-span-4 flex flex-col gap-6">
      <div class="flex-1 bg-slate-900 rounded-3xl p-6 sm:p-8 flex flex-col shadow-xl">
        <div class="flex items-center justify-between mb-8">
          <h2 class="text-white font-black text-xl uppercase tracking-tighter">Hall of Fame</h2>
          <div class="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center text-xs">🏆</div>
        </div>
        
        <div class="space-y-4 overflow-hidden flex-1" id="leaderboard-container">
          </div>

        <div class="mt-6 pt-6 border-t border-white/10">
          <div class="flex items-center gap-4 p-3 bg-blue-600/20 border border-blue-500/50 rounded-xl">
            <span class="text-blue-400 font-black italic w-6 text-center">-</span>
            <div class="flex-1">
              <p class="text-white font-bold text-sm tracking-wide">
                <span class="text-slate-400 font-normal mr-1 text-[10px]">학번</span><span id="lb-my-id"></span>
                <span class="text-slate-400 font-normal ml-3 mr-1 text-[10px]">이름</span><span id="lb-my-name"></span> (나)
              </p>
              <p class="text-xs text-blue-400 font-medium mt-0.5">
                <span class="text-blue-200 font-normal text-[10px]">현재 도전 중...</span>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="view-loading" class="hidden flex-col items-center w-full max-w-md mx-auto">
    <div class="bg-white w-full rounded-3xl p-10 shadow-sm border border-slate-200 text-center flex flex-col items-center">
      <div class="mb-8 animate-spin">
        <div class="p-4 bg-sky-50 rounded-full flex items-center justify-center">
          <i data-lucide="loader-2" class="w-12 h-12 text-sky-500"></i>
        </div>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 mb-3">결과를 정리하고 있어요</h2>
      <p id="loading-msg" class="text-slate-500 leading-relaxed max-w-xs mx-auto">
        선생님의 따뜻한 피드백을 준비하고 있습니다. 조금만 기다려주세요!
      </p>
    </div>
  </div>

  <div id="view-result" class="hidden flex-col w-full max-w-4xl mx-auto space-y-6">
    <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-sm border border-slate-200 text-center">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-100 text-emerald-600 mb-6">
        <i data-lucide="award" class="w-10 h-10"></i>
      </div>
      <h1 class="text-3xl font-black text-slate-800 mb-2">학습 완료!</h1>
      <p class="text-lg font-medium text-slate-500">
        <span id="result-name" class="text-emerald-600 font-bold"></span> 학생, 정말 수고했어요!
      </p>
    </div>
    
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center">
        <p class="text-slate-400 text-sm font-bold uppercase mb-1">총 문제</p>
        <p class="text-2xl font-black text-slate-800">15</p>
      </div>
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center">
        <p class="text-slate-400 text-sm font-bold uppercase mb-1">맞힌 개수</p>
        <p class="text-2xl font-black text-emerald-600" id="result-score">0</p>
      </div>
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center">
        <p class="text-slate-400 text-sm font-bold uppercase mb-1">소요 시간</p>
        <p class="text-2xl font-black text-slate-800"><span id="result-time">0</span>초</p>
      </div>
      <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:col-span-1 col-span-2 items-center justify-center">
        <button id="btn-pdf" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 py-3 rounded-xl font-bold transition-colors flex items-center justify-center">
          <i data-lucide="file-text" class="w-5 h-5 mr-2"></i> 결과 PDF 보기
        </button>
      </div>
    </div>
    
    <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-sm border border-slate-200">
      <div class="flex items-start gap-4">
        <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center shrink-0">
          <i data-lucide="message-circle" class="w-6 h-6"></i>
        </div>
        <div>
          <h3 class="text-lg font-bold text-slate-800 mb-2">선생님의 한마디</h3>
          <p id="result-feedback" class="text-slate-600 leading-relaxed font-medium"></p>
        </div>
      </div>
    </div>
    
    <div class="py-6 flex justify-center">
      <button id="btn-restart" class="px-8 py-4 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold flex items-center transition-all">
        <i data-lucide="rotate-ccw" class="w-5 h-5 mr-2"></i> 처음으로 돌아가기
      </button>
    </div>
  </div>

</div>

<script>
  // 페이지가 로드되면 아이콘을 그립니다.
  document.addEventListener("DOMContentLoaded", function() {
    lucide.createIcons();
  });

  // ★ Google Apps Script 배포 URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbw3gYZBJMNv8xnyskxW8f4bU2-pQ1Chc4_y8RM1sbrl3TRJuKc08bPasp0iqbpYmpHlxw/exec";
  
  // ★ AI 피드백을 위한 API 키
  const GEMINI_API_KEY = "발급받은_Gemini_API키를_여기에_입력하세요"; 
  
  let user = { id: '', name: '', loginTime: '' };
  let questions = [];
  let currentQuestionIndex = 0;
  let answers = [];
  let quizStartTime = null;
  let timerInterval = null;
  let pdfUrl = null;
  
  // Quiz Mock Leaderboard
  const initialLeaderboard = [
    { studentId: "30205", studentName: "김수학", score: 15, time: 24.5 },
    { studentId: "30112", studentName: "이연산", score: 15, time: 28.2 },
    { studentId: "30301", studentName: "박정수", score: 14, time: 31.0 }
  ];

  function showView(viewId) {
    document.querySelectorAll('#app > div').forEach(el => {
      el.classList.add('hidden');
      el.classList.remove('flex', 'grid');
    });
    const target = document.getElementById(viewId);
    if(viewId === 'view-quiz') {
      target.classList.remove('hidden');
      target.classList.add('grid');
    } else {
      target.classList.remove('hidden');
      target.classList.add('flex');
    }
  }

  // ==== 1. 로그인 ====
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('login-id').value.trim();
    const name = document.getElementById('login-name').value.trim();
    const pw = document.getElementById('login-pw').value.trim();
    const errEl = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');
    const btnTxt = document.getElementById('login-btn-text');
    const spinner = document.getElementById('login-spinner');

    if (!id || !name || !pw) {
      errEl.textContent = '모든 항목을 입력해주세요.';
      return;
    }

    errEl.textContent = '';
    btn.disabled = true;
    spinner.classList.remove('hidden');
    btnTxt.textContent = '확인 중...';

    try {
      const res = await fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "login", id, name, password: pw })
      });
      const data = await res.json();
      
      if (data.success) {
        user = { id, name, loginTime: new Date().toLocaleString() };
        startQuiz();
      } else {
        errEl.textContent = data.message || '로그인에 실패했습니다.';
      }
    } catch (err) {
      errEl.textContent = '서버 통신 중 오류가 발생했습니다.';
    } finally {
      btn.disabled = false;
      btnTxt.textContent = '학습 시작하기';
      spinner.classList.add('hidden');
    }
  });

  // ==== 2. 퀴즈 생성 및 진행 ====
  function getRandomInt() {
    const nums = [-15, -14, -13, -12, -11, -10, -9, -8, -7, -6, -5, -4, -3, -2, 2, 3, 4,
